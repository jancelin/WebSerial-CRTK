<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8" />
  <title>Centipede-RTK Web Serial</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0a63a8">
  <link rel="icon" type="image/png" href="static/logo.png" />
  <link rel="stylesheet" href="static/css/styles.css">
  <link rel="stylesheet" href="static/css/index-styles.css">
</head>

<body>
  <!-- Mode Switch -->
  <div class="mode-switch-container mobile-top-left">
    <div class="mode-switch">
      <span>Débutant</span>
      <label class="switch">
        <input type="checkbox" id="modeSwitch">
        <span class="slider round"></span>
      </label>
      <span>Avancé</span>
    </div>
  </div>

  <div class="main-content">
    <h1 class="brand">
      <img src="static/logo.png" alt="Logo" class="logo" />
      Centipede-RTK Web Serial
    </h1>

    <div class="main-container">
      <!-- Boutons principaux + Baud -->
      <div class="control-group">
        <div class="control-row connect-row mobile-connect-row" style="align-items: stretch;">
          <button id="connect" class="btn btn-primary" style="flex: 1; height: 75px; min-width: 120px;">🔌
            Connecter</button>
          <button id="disconnect" class="btn btn-primary hidden" disabled
            style="flex: 1; height: 75px; min-width: 120px;">⏏️ Déconnecter</button>
          <div style="flex: 1; height: 75px; display: flex; flex-direction: column; justify-content: center">

              <select id="transport" class="transport-select">
                <option value="serial">USB-C</option>
                <option value="ble" selected>Bluetooth</option>
              </select>
              <img class="transport-icon ble-icon"
                src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAACXBIWXMAAAsTAAALEwEAmpwYAAAFvElEQVR4nO2W248TZRjGi+IVnXMHvTMa/wZjjJGQGI0XZtnOTM+nNZEL/wlQMLiHHqbb87Zdeth23cSbRRQFZcMFysqyi3gjS1Q0wA1wwWnZlfCa72unnW+m7eLFLMTskzxpZpI2v+f73kNttm1ta1vbwtqff2HXh7N7qZHmISrcXLCHm6tUuHGLjjQeo08q3Filw40FKtT4lAnV99r2nN5peyZ04MBz9pG5/dTI7F9UZBaQ6UhT5wbQYc0zHVPh+lUmWP8Iff+psTO+Gc4emf2WGnlycDpcByakuYZ8gglPs1sOL348Z7ePNBdbp24AD80A7S8D5ckD7S8BHar3Am+7Ckygek5U5uxbGsAeadapfifuL8HhL36C23fXIDG/BKy3AEywZgYPaq4AHaxUtgyeCjXfJ8A78O369uTgwfo/oKny/a/AevMtWAM4E6wAi30UhXhvawJEmhfIUydrnHZnwKgqCuHJAROomMDZgObyecvh7SMzb/Vu0G6N9wrQDZFtwRLg0x3z/uk3LA1AhRu5zSZLvwBaCM6dAdbfhWaxy8D6y8D5SmkL8WEHFZ75e8BIbAVwpU3QelVOXQLOncbAGjiG95dQgKuW4dOB6muDwLXmNAZglAQUT6wYQl0CzpUC1ldqgWv2FYEJFF6xJkCo5iXBq0D7pnDJ0GhUthuUdqUIWFqZxCduvInssSVg3ek2fBHDtzzltiQAE6x/RpSKrwDjXy7C/YcbkPnqAnDtBkXAxgCsvwS8exKuXL/deX/n/jowsqoHb7vwiTUBQrWmfgnRrgzcW9swNagpgJzE5VI7dcl8A64UAc97C8B78nVLAtChyhlie3rzkD2+bGpYVlGJd5ycMMHXTv0CvJIEzlsg4XGAwoI1AQLVZWIJBabxiRtru2qCHQzPa+DYeeC8+SVLAjDBo6um7YlGoDtlmjL9pIfnDeDYnjzqpd+sCRA4eqPX9kQNyromofjNyhPBI0gTuBfB57A5d/a6RQGm7/banq0NWgTOlewbAsELsqqDN4Pz2FngPZk7lgRgA+VHJnBiCRVAcKnEqES6cu02OJR4C3AAuKDZnX5k3Q10wPXwReC8U8ApKpROkFNJUx3fQMIAnTOAZ7B5d9qaG2B8pRskeGv1bwbfDXERBCkOvDvbE1zATgPvSlnTA5yvtEqA/wd4fQiHFDNAZzC4Zl5JWTOFOH9xubv2EXwBTxXUoETDnrw48Ll+cgUczhgIri40tivVspKyZg9w3uIZ/dpHfwNyx86bYPnhCeKdMDyGoc0hol1oVwoc2JMguCat2cSsb6qhX/usMwb31tYJeFTjrCEAt28cn7gxRG5+EXhntAPesazWLAnA+QqH9duTU5IwMXcW7q9tQHb+506DcsPjhgBj+IRFaQyuXLvVeX/3wTrwQ2NdcCWJLSjqQWsCePMecgnlgJNVfOLok0fN6MniEycDjOJyMd5Afn4RBOcEOJQuvENRQVRU2ZIAjC/z6uZLKINPXC9+6AiUv14i3s2cXAERlZasEvDILzlTL9usEu/JXh20hFoBRk0NSzx/twzivjEdfAtcRM9y/E/L4NsBMoOWEDI3RAYgT14Pr3bARTmB7ZATKUsDcO70m/3AtVnOD32+CXzCBC5ix4FXoq/brBbvzpzvBa7NclTzveFHMXwvcBFZii1aDt8KkH63F7g2DtENPHi4Yaj5URClRB/wOIKH3c7YO7atkqCkKkZwbZYLw+NwpL6A90N+/hzsHkLw8b7gohRDi65s20q9GBjf5VAmf+yC62a5nMB/H4QPjoBjnx7eDC4iOyfOot+zbbU4Jc8IcvJ4d47rR2L/UtG8W4qC6Iwe4/0qbXt6gh2ikowIsvpHv8nSB/x3UYqF0fdtz                 alt="Bluetooth" style="display:none;">
            </div>
            <div class="muted" id="deviceName" style="margin-top:6px; font-size:12px; flex: 0 0 auto;">—</div>
          </div>
        </div>
      </div>

      <!-- Contrôles de configuration -->
      <div class="control-group">
        <div class="control-row config-row mobile-config-row" style="align-items: flex-end; flex-wrap: wrap;">
          <div style="flex: 1; display: flex; align-items: flex-end; gap: 8px;">
            <div style="flex: 2 1 0; min-width: 0;">
              <label>Configurations</label>
              <div class="file-group" style="display: flex; gap: 8px; align-items: flex-end;">
                <select id="configSelect">
                  <option value="">— Choisir une configuration —</option>
                </select>
                <button id="refreshList" class="refresh-btn" title="Rafraîchir la liste">↻</button>
              </div>
            </div>
            <div style="flex: 0 0 auto; display: flex; align-items: flex-end;">
              <div class="settings-menu">
                <button class="settings-btn" id="settingsToggle" title="Paramètres avancés">⚙️</button>
              </div>
            </div>
          </div>
        </div>
        <div id="configSummaryTableContainer" class="config-summary hidden"></div>
      </div>

      <!-- Zone de description -->
      <div class="control-group" id="configDescriptionContainer" style="display: none;">
        <div class="config-description" id="configDescription">
          <!-- Description dynamique -->
        </div>
      </div>

      <!-- Téléverser (déplacé juste après la description) -->
      <div class="control-group" style="margin-top: 8px;">
        <button id="upload" class="btn btn-success" disabled style="width:100%;">📤 Téléverser</button>
      </div>

      <!-- Barre de progression -->
      <div class="progress-container hidden" id="progressContainer">
        <div class="progress-header">
          <div></div>
          <button class="progress-info-btn" id="terminalToggle" title="Afficher/masquer le terminal UART">i</button>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill" style="width: 0%"></div>
        </div>
        <div class="progress-text" id="progressText">En attente...</div>
        <div class="uart-terminal hidden" id="uartTerminal"></div>
      </div>

      <!-- Status -->
      <div id="status" class="status info">
        Prêt à se connecter
      </div>
    </div>

    <!-- Modale des paramètres -->
    <div class="settings-modal" id="settingsModal">
      <div class="settings-content">
        <div class="modal-header">
          <h2 class="modal-title">Paramètres avancés</h2>
          <button class="close-btn" id="closeModal" title="Fermer">✕</button>
        </div>

        <div class="control-group">
          <label>Fin de ligne</label>
          <select id="eol">
            <option value="\r\n" selected>CRLF</option>
            <option value="\n">LF</option>
            <option value="\r">CR</option>
            <option value="">Aucun</option>
          </select>
        </div>

        <div class="control-group">
          <label>Vitesse de transmission</label>
          <select id="baud">
            <option>4800</option>
            <option>9600</option>
            <option>19200</option>
            <option>28800</option>
            <option>38400</option>
            <option>57600</option>
            <option>76800</option>
            <option selected>115200</option>
            <option>230400</option>
            <option>460800</option>
            <option>576000</option>
            <option>921600</option>
          </select>
        </div>

        <div class="control-group">
          <label>Délai entre commande(s)</label>
          <input id="delay" type="number" min="0" step="0.1" value="5">
        </div>

        <div class="control-group">
          <label>Charger un fichier personnel</label>
          <input id="configFile" type="file" accept=".txt,.cfg,.conf,.ini,.log,.nmea,.csv,.*" />
        </div>

        <div class="control-group">
          <button id="save" class="btn btn-primary" style="width:100%;margin-top:8px">💾 SAVECONFIG</button>
        </div>
      </div>
    </div>

    <footer>
      <span>🄯 2025 by Centipede-RTK</span>
      <a href="https://github.com/jancelin/WebSerial-CRTK" target="_blank" rel="noopener">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path fill="currentColor"
            d="M8 .2a8 8 0 0 0-2.53 15.59c.4.07.55-.17.55-.38v-1.34c-2.25.49-2.72-1.08-2.72-1.08-.37-.95-.9-1.2-.9-1.2-.74-.51.06-.5.06-.5.82.06 1.25.85 1.25.85.73 1.24 1.92.88 2.39.67.07-.53.28-.88.5-1.08-1.8-.2-3.7-.9-3.7-4a3.14 3.14 0 0 1 .84-2.18 2.9 2.9 0 0 1 .08-2.15s.68-.22 2.22.83a7.6 7.6 0 0 1 4.05 0c1.54-1.05 2.22-.83 2.22-.83.45 1.08.17 1.89.09 2.09a3.13 3.13 0 0 1 .84 2.18c0 3.11-1.9 3.8-3.71 4 .29.25.54.73.54 1.48v2.2c0 .21.15.45.55.38A8 8 0 0 0 8 .2Z" />
        </svg>
        github.com/jancelin/Webserial-CRTK
      </a>
    </footer>

    <script src="static/js/script.js"></script>
    <script src="static/js/index-script.js"></script>
    <script>
      // Sélection dynamique du transport par défaut selon la largeur d'écran
      document.addEventListener('DOMContentLoaded', function () {
        var transportSelect = document.getElementById('transport');
        if (transportSelect) {
          if (window.innerWidth <= 600) {
            transportSelect.value = 'ble';
          } else {
            transportSelect.value = 'serial';
          }
        }
      });
    </script>
</body>

</html>
